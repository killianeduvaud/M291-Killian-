<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeu du prompt — e1-5</title>
  <style>
    /* Mise en page simple : on n'y touche pas pendant l'exercice. */
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f3eb;
      color: #1a1a1a;
      padding: 2rem 1.25rem;
    }
    main { max-width: 36rem; margin: 0 auto; }
    h1 { color: #0f4c5c; }

    /* Le bouton à transformer. Son id est "magic" : citez-le dans le prompt. */
    #magic {
      font-size: 1.15rem;
      padding: 0.75rem 1.25rem;
      border: 2px solid #1a1a1a;
      background: #d9d0c3;
      color: #1a1a1a;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Jeu du prompt</h1>
    <p>Ce bouton est gris. Votre job : le faire changer de couleur <strong>au clic</strong>, en demandant à une IA. Vous ne codez pas à la main.</p>
    <button type="button" id="magic" onclick="this.style.background = '#e36414'">Cliquez-moi</button>
  </main>
</body>
</html>
