<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette retenue · Devisexpress</title>
<style>
/* Direction retenue : structure contrastée de la piste C + chaleur de la piste B.
   Tous les couples de couleurs texte/fond sont ≥ 4,5:1 (voir ../critique.md). */
:root {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --text: #16181D;
  --muted: #4B5059;
  --accent: #B23F0A;
  --on-accent: #FFFFFF;
  --dock: #16181D;
  --error: #B3261E;
  --success: #1E6B3A;
  --focus: #1D4ED8;
  --radius: 14px;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 390px; min-height: 844px; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; }
.app { min-height: 844px; display: flex; flex-direction: column; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
header { padding: 22px 18px 6px; }
.kicker { margin: 0 0 2px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0 0 14px; font-size: 32px; font-weight: 800; letter-spacing: -.02em; }
.search { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 2px solid var(--text); border-radius: var(--radius); background: var(--surface); }
.search:focus-within { outline: 3px solid var(--focus); outline-offset: 3px; }
.search svg { width: 20px; height: 20px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.search input { flex: 1; border: 0; background: transparent; font: inherit; color: var(--text); outline: none; }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }
.chip { min-height: 48px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--text); background: var(--surface); color: var(--text); font: inherit; font-size: 15px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--text); color: #FFFFFF; }
main { flex: 1; padding: 0 18px 124px; }
.count { margin: 12px 0 10px; font-size: 15px; color: var(--muted); }
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.card { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 76px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 2px solid var(--text); box-shadow: 0 2px 8px rgba(22, 24, 29, .08); color: inherit; text-decoration: none; }
.card strong { display: block; font-size: 17px; }
.card small { display: block; margin-top: 4px; font-size: 15px; color: var(--muted); }
.card b { font-size: 17px; white-space: nowrap; }
.dock { position: fixed; left: 0; bottom: 0; width: 390px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px 22px; background: var(--dock); color: #FFFFFF; }
.dock p { margin: 0; display: flex; flex-direction: column; font-size: 14px; }
.dock strong { font-size: 17px; }
.primary { min-height: 52px; padding: 0 22px; border: 2px solid #FFFFFF; border-radius: var(--radius); background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; }
.dock .primary:focus-visible { outline-color: #FFFFFF; }
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="kicker">Catalogue des prestations</p>
    <h1>Devisexpress</h1>
    <label class="search">
      <span class="sr-only">Rechercher une prestation</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input type="search" placeholder="Rechercher une prestation…">
    </label>
    <nav class="chips" aria-label="Filtrer par catégorie">
      <button class="chip" aria-pressed="false">Tout</button>
      <button class="chip" aria-pressed="false">Peinture int.</button>
      <button class="chip" aria-pressed="true">✓ Façade</button>
      <button class="chip" aria-pressed="false">Préparation</button>
    </nav>
  </header>
  <main>
    <p class="count" aria-live="polite">4 prestations · Façade</p>
    <ul class="cards">
      <li><a class="card" href="#peinture-facade"><span><strong>Peinture façade, 2 couches</strong><small>Façade · par m²</small></span><b>CHF 30.–</b></a></li>
      <li><a class="card" href="#reparation-crepi"><span><strong>Réparation crépi</strong><small>Façade · par m²</small></span><b>CHF 45.–</b></a></li>
      <li><a class="card" href="#nettoyage"><span><strong>Nettoyage haute pression</strong><small>Façade · par m²</small></span><b>CHF 8.–</b></a></li>
      <li><a class="card" href="#fixateur"><span><strong>Fixateur de fond</strong><small>Façade · par m²</small></span><b>CHF 6.–</b></a></li>
    </ul>
  </main>
  <footer class="dock">
    <p><span>Devis pour S. Rochat</span><strong>1 ligne · CHF 2'550.–</strong></p>
    <button class="primary">Voir le devis</button>
  </footer>
</div>
</body>
</html>
